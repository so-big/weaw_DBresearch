# DBresearch stack.
name: dbresearch

x-app: &app
  build: .
  image: dbresearch-app:dev
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://dbresearch:${POSTGRES_PASSWORD}@db:5432/dbresearch
    BLOB_DIR: /data/blobs
    PORT: ${PORT:-8120}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    SETTING_FILE: ${SETTING_FILE:-setting.txt}
    MYSQL_HOST: ${MYSQL_HOST:-10.27.50.43}
    MYSQL_PORT: ${MYSQL_PORT:-3307}
    MYSQL_DATABASE: ${MYSQL_DATABASE:-dbresearch}
    MYSQL_USERNAME: ${MYSQL_USERNAME:-ocr_worker}
  volumes:
    - ./data/blobs:/data/blobs
    - ./secrets/kek.json:/run/secrets/kek.json:ro
    - ./setting.txt:/app/setting.txt:ro
    - ./root.txt:/app/root.txt:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    container_name: dbresearch-db
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: dbresearch
      POSTGRES_USER: dbresearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=th-TH --locale=C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbresearch -d dbresearch"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    container_name: dbresearch-web
    ports:
      - "${PORT:-8120}:${PORT:-8120}"
    tmpfs:
      - /tmp:size=1g,mode=1777

  worker:
    <<: *app
    container_name: dbresearch-ocr
    command: ["python", "-m", "dbresearch.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://dbresearch:${POSTGRES_PASSWORD}@db:5432/dbresearch
      BLOB_DIR: /data/blobs
      TMPDIR: /tmp/work
      MYSQL_HOST: ${MYSQL_HOST:-10.27.50.43}
      MYSQL_PORT: ${MYSQL_PORT:-3307}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dbresearch}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-ocr_worker}
    tmpfs:
      - /tmp/work:size=1g,mode=0700,uid=10001,gid=10001
    volumes:
      - ./data/blobs:/data/blobs
      - ./secrets/kek.json:/run/secrets/kek.json:ro
      - ./setting.txt:/app/setting.txt:ro

volumes:
  pgdata:
