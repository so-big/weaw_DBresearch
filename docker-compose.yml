# ======================================================================
# DBresearch - Production Stack (OCR Worker Only)
# Note: Web Server has moved to an external server.
# This stack runs the OCR Worker connected to MySQL (10.27.50.43:3307).
# ======================================================================
name: dbresearch-prod

services:
  ocr:
    build: .
    image: dbresearch-ocr:latest
    container_name: dbresearch-ocr
    restart: unless-stopped
    command: ["python", "-m", "dbresearch.worker"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: .env
        required: false
    environment:
      SETTING_FILE: setting.txt
      BLOB_DIR: /data/blobs
      TMPDIR: /tmp/work
    tmpfs:
      - /tmp/work:size=1g,mode=0700,uid=10001,gid=10001
    volumes:
      - ./data/blobs:/data/blobs
      - ./secrets/kek.json:/run/secrets/kek.json:ro
      - ./setting.txt:/app/setting.txt:ro
