# ======================================================================
# DBresearch - Development Sandbox Stack (Offline Web + Local DB + Worker)
# Used for local development, UI testing, and offline experiments.
# ======================================================================
name: dbresearch-dev

x-app: &app
  build: .
  image: dbresearch-app:dev
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://dbresearch:${POSTGRES_PASSWORD:-devpass}@db:5432/dbresearch
    BLOB_DIR: /data/blobs
    PORT: ${PORT:-8120}
    SETTING_FILE: setting.txt
  volumes:
    - ./data/blobs:/data/blobs
    - ./secrets/kek.json:/run/secrets/kek.json:ro
    - ./setting.txt:/app/setting.txt:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    container_name: dbresearch-dev-db
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: dbresearch
      POSTGRES_USER: dbresearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=th-TH --locale=C.UTF-8
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbresearch -d dbresearch"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    container_name: dbresearch-dev-web
    ports:
      - "${PORT:-8120}:${PORT:-8120}"
    tmpfs:
      - /tmp:size=1g,mode=1777

  worker:
    <<: *app
    container_name: dbresearch-dev-worker
    command: ["python", "-m", "dbresearch.worker"]
    tmpfs:
      - /tmp/work:size=1g,mode=0700,uid=10001,gid=10001

volumes:
  pgdata_dev:
